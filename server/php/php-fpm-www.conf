; /opt/services/savepearlharbor.com/php-fpm-www.conf
; mount as /usr/local/etc/php-fpm.d/zz-www.conf  (loaded after www.conf, overrides it)
;
; The stock wordpress:php8.3-fpm image ships pm.max_children = 5 on an 8-vCPU /
; 15.6 GB host. At 3.5 req/s with ~1.6 s per uncached request the pool needs
; ~5.6 workers, i.e. it is permanently saturated -> requests queue in the FPM
; backlog -> the 12-75 s response times and the 8.4 % of 499s in the log.
;
; NB: adding this file means editing docker-compose.yml, which means the php
; container is RECREATED (docker compose up -d php), not just restarted.

[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Без него зависший запрос держит воркера ВЕЧНО, и 16 таких кладут пул целиком —
; ровно тот сценарий, из которого сайт только что вытащили. php.ini-шный
; max_execution_time = 300 тут не страхует: на Linux он не считает время,
; проведённое в ожидании MySQL, а именно там запросы и висли.
; 310s = чуть больше, чем fastcgi_read_timeout 300 в nginx: легальный запрос
; успевает завершиться (или nginx сам его бросает), а мёртвый воркер
; освобождается, а не копится.
request_terminate_timeout = 310s

; surface saturation instead of guessing at it
;
; pm.status_path: НЕ проброшен в nginx намеренно — снаружи страница недоступна.
;   Понадобится — смотреть изнутри: docker exec ... cgi-fcgi, либо временно
;   добавить location в nginx.conf.
;
; slowlog: в контейнере НЕТ CAP_SYS_PTRACE, поэтому на каждый медленный запрос
;   php-fpm пишет ПАРУ строк: полезный
;     WARNING: [pool www] child N, script '.../index.php' (request: "GET /index.php?feed=rss2&author=1") executing too slow (5.9 sec)
;   и бесполезный
;     ERROR: failed to ptrace(ATTACH) child N: Operation not permitted (1)
;   Стектрейса не будет, но URL медленного запроса виден — ради этого и включено.
;   Шум ограничен ротацией docker-логов (max-size 50m, max-file 5) в compose.
;   Убирать ptrace-ошибку через cap_add: SYS_PTRACE не стоит: ради дампа стека
;   давать контейнеру право трассировать процессы — плохой размен.
pm.status_path = /php-fpm-status
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
