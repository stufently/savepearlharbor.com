services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      - nginx

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    expose:
      - "80"
    volumes:
      - ./site:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./sitemap-static:/var/www/sitemap:ro
      - ./nginx.d:/etc/nginx/sph:ro
      - ./logs/nginx:/var/log/sph
    tmpfs:
      - /var/cache/nginx/sph:size=1600m
    depends_on:
      - php

  php:
    image: wordpress:php8.3-fpm
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - ./site:/var/www/html
      - ./php-custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./php-fpm-www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
      - ./php-opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: habr
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set in .env}
      WORDPRESS_DB_NAME: habr
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./habr.sql.gz:/docker-entrypoint-initdb.d/habr.sql.gz:ro
      - ./mysql-tuning.cnf:/etc/mysql/conf.d/zz-tuning.cnf:ro
    environment:
      MYSQL_DATABASE: habr
      MYSQL_USER: habr
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
