# /opt/services/savepearlharbor.com/nginx.d/bots.conf -> /etc/nginx/sph/bots.conf
# Included from nginx.conf at http{} level. Blocked clients get 403
# everywhere (UA-blocked ones still get /robots.txt, which Disallows them).
# Edit here, then: docker exec savepearlharborcom-nginx-1 nginx -t && ... nginx -s reload
#
# Policy (owner, 2026-10-06, from the traffic analysis):
#   * blocked: SEO / backlink / data-broker / media-monitoring crawlers and
#     generic HTTP libraries;
#   * ALLOWED, never add here: search engines (Google*, Yandex*, bingbot,
#     Applebot, Baiduspider, DuckDuckBot, Seznam), link previews
#     (facebookexternalhit, Twitterbot, TelegramBot, WhatsApp, LinkedInBot,
#     Slackbot, VKRobot), feed readers (Miniflux ...) and ALL AI crawlers
#     (GPTBot, OAI-SearchBot, ChatGPT-User, ClaudeBot, Amazonbot, PerplexityBot,
#     Bytespider, meta-externalagent, Reflectionbot ...) -- owner decision.
#   * fake Googlebot is NOT filtered (0.1% of traffic; needs Google's IP list).

map $http_user_agent $sph_bad_bot {
    default                   0;
    "~*AhrefsBot"             1;
    "~*AhrefsSiteAudit"       1;
    "~*SemrushBot"            1;
    "~*SERankingBacklinksBot" 1;
    "~*SERanking"             1;
    "~*keys-so-bot"           1;
    "~*DotBot"                1;
    "~*DataForSeoBot"         1;
    "~*MJ12bot"               1;
    "~*PetalBot"              1;
    "~*QlyzeBot"              1;
    "~*SemanticVisionsBot"    1;
    "~*AionBot"               1;
    "~*LinkupBot"             1;
    "~*GuzzleHttp"            1;
    "~*BLEXBot"               1;
    "~*serpstatbot"           1;
    "~*Barkrowler"            1;
    "~*MegaIndex"             1;
    "~*trendictionbot"        1;
    "~*Twingly"               1;
    "~*Mediatoolkitbot"       1;
    "~*um-IC/"                1;   # ubermetrics media monitoring
    "~*BacklinkCrawler"       1;
    "~*SeekportBot"           1;
    "~*Siteimprove"           1;
    "~*ZoominfoBot"           1;
}

# Scraper source networks (UA rotates, browser-like). Matched on $remote_addr,
# which realip has already set to the client from Caddy's X-Forwarded-For.
# Only the single Azure IP: bingbot also crawls from Azure ranges.
geo $sph_bad_net {
    default          0;
    43.172.0.0/16    1;   # Tencent Cloud
    43.173.0.0/16    1;   # Tencent Cloud
    20.249.5.100/32  1;   # Azure, one scraper host
}

map "$sph_bad_net$sph_bad_bot:$uri" $sph_block {
    default            0;
    "~^1"              1;   # bad network: everything
    "01:/robots.txt"   0;   # bad UA: may still read robots.txt
    "~^01:"            1;
}
