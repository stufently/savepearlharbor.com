# /opt/services/savepearlharbor.com/nginx.conf
# mounted as /etc/nginx/conf.d/default.conf
# (that path is included INSIDE http{}, so map/geo/limit_req_zone are legal here)
#
# CONTEXT: WordPress on this site runs with permalink_structure = "" (PLAIN
# permalinks). There are therefore NO rewrite rules: every real URL is either a
# physical file or "/" plus a query string (/?p=123, /?cat=1, /?feed=rss2,
# /?sitemap=index). Anything else used to fall through to index.php and render
# the homepage with HTTP 200 -- an unbounded soft-404 crawl trap.
#
# Applied 2026-08-11. Revision 2 the same day closes four holes found by review
# and verified against prod before and after; every one of them was a live 200
# serving the 115 KB homepage:
#   /wp-json/                          200 html  ->  now real JSON (rest_route)
#   /?paged=100&sitemap=bogus          200 html  ->  now 410
#   /?sitemap-subtype=post&paged=100   200 html  ->  now 410
#   /?paged=-100 %2D100 %20100 +100    200 html  ->  now 410

# ---------- [1] real client IP (Caddy is the only upstream) ----------
# VERIFIED 2026-08-11: the compose network is 172.19.0.0/16 (docker network
# inspect savepearlharborcom_default). The /12 covers it, but docker can hand
# out 192.168.x on recreate -- so all three RFC1918 ranges are listed. If this
# ever stops matching, nginx silently treats Caddy as the client and limit_req
# throttles the whole site as one visitor.
#
# Trusting all of RFC1918 is safe HERE specifically because nginx is not
# reachable from the internet: compose gives it `expose: 80`, never `ports:`,
# so the only peer that can ever connect is a container on the compose network.
# Publish nginx's port and this becomes an XFF-spoofing hole -- narrow the
# ranges to Caddy's address at that moment.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header    X-Forwarded-For;
# off = take the RIGHTMOST XFF entry, i.e. the one Caddy appended itself.
# Caddy is the first hop and discards client-supplied X-Forwarded-* from
# untrusted peers, so that entry is unspoofable.
real_ip_recursive off;

# ---------- [2] deep-pagination detector ----------
# WP core sitemaps live at /?sitemap=...&paged=1..136 -> must NOT be caught.
#
# ANCHORED AT THE START OF $args ON PURPOSE. The first version matched
# "(^|&)sitemap[-=]" anywhere, which turned the exemption into a bypass: both
# /?paged=100&sitemap=bogus and /?sitemap-subtype=post&paged=100 served the
# full homepage with 200 (verified on prod). Every genuine WP core sitemap URL
# puts sitemap= FIRST -- /?sitemap=index and
# /?sitemap=posts&sitemap-subtype=post&paged=136 -- so anchoring costs nothing.
# "[a-z]" after "=" (2026-10-06): an EMPTY sitemap= is not a sitemap request
# for WordPress -- /?sitemap=&paged=27000 fell through to the main query and
# served the 115 KB homepage with 200. Every real sitemap name is lowercase
# (index, posts, taxonomies, users); a bogus name gets WP's own 404.
map $args $sph_is_sitemap {
    default            0;
    "~^sitemap=[a-z]"  1;
}
# Leading zeros matter: PHP absint("0100") == 100, so "0*" must be allowed or
# ?paged=0100 slips through. No trailing anchor on purpose -- ?paged=100abc is
# also absint()'d to 100 by WP and must be caught too.
#
# The (%20|\+|%09|-|%2[Dd])* prefix exists because absint() is intval() |> abs():
# intval() skips leading whitespace and honours a sign, and PHP decodes both +
# and %20 in a query string to a space. So paged=-100, paged=%2D100,
# paged=%20100 and paged=+100 all mean page 100 to WordPress. All four served
# 200 before this was added (verified on prod). $request_uri is the RAW uri,
# so the percent-escapes are still text here and must be matched as text.
map $request_uri $sph_deep_raw {
    default                                              0;
    "~*[?&]paged?=(%20|\+|%09|-|%2D)*0*[1-9][0-9]{2,}"   1;   # ?paged=100.. / ?page=100..
    "~*/page/0*[1-9][0-9]{2,}(/|$|\?)"                   1;   # /page/100../
}
# /wp-admin/ and /wp-json/ are exempt: their ?paged=/?page= is the admin list
# and REST paging (271k posts), not crawlable HTML. Matched on $uri, NOT on
# $request_uri: $uri is already normalised (dot segments, //, %xx), so
# /wp-json/../?paged=100 is "/" here and still gets 410, while //wp-admin/
# and /wp%2Djson/ are still recognised. No query in $uri, so ?s=wp-admin/ can't
# trigger it either.
map $uri $sph_admin_rest {
    default                  0;
    "~^/wp-(admin|json)(/|$)" 1;
}
map $sph_is_sitemap$sph_admin_rest$sph_deep_raw $sph_deep {
    default 0;
    "001"   1;    # deep AND not a sitemap AND not admin/REST
}

# ---------- [3] rate limit (secondary) ----------
# Useless against the 1-request-per-IP botnet, but caps the single-IP heavy
# crawlers (GPTBot 12169 req from 1 IP, Dragonfly 2001 from 1, DotBot 698 from 1).
limit_req_zone   $binary_remote_addr zone=sph_php:16m rate=2r/s;
limit_req_status 429;
limit_conn_zone  $binary_remote_addr zone=sph_conn:16m;
limit_conn_status 429;

# ---------- [4] static sitemaps (2026-10-06) ----------
# WP core sitemaps cost ~4 s of PHP + MySQL per page (2000 posts) and are
# re-crawled all day by bingbot/AhrefsBot. bin/sitemap-gen.py (root cron,
# hourly, incremental) snapshots them into ./sitemap-static/current/ and
# nginx serves those files without PHP. PUBLIC URLs ARE UNCHANGED.
#
# Keyed on $request_uri (the raw, never-rewritten request line) so the value
# cannot change across internal redirects. Only the exact canonical forms WP
# itself puts into the index are mapped; any other spelling (&amp;, reordered
# params, paged=01) is left to PHP as before. Names MUST match RULES in
# bin/sitemap-gen.py.
map $request_uri $sph_sitemap_file {
    default "";
    "/?sitemap=index"                                                                   index.xml;
    "~^/\?sitemap=posts&sitemap-subtype=(post|page)&paged=([1-9][0-9]{0,3})$"           posts-$1-$2.xml;
    "~^/\?sitemap=taxonomies&sitemap-subtype=(category|post_tag)&paged=([1-9][0-9]{0,3})$" taxonomies-$1-$2.xml;
    "~^/\?sitemap=users&paged=([1-9][0-9]{0,3})$"                                       users-$1.xml;
}

server {
    listen 80;
    server_name savepearlharbor.com www.savepearlharbor.com;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ---- [A] deep pagination -> 410 Gone ----
    # server-level "if" with a bare "return" is one of the two documented-safe uses of if
    if ($sph_deep) { return 410; }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Legacy sitemap names. Plain permalinks put the real sitemap on a query
    # string, so /sitemap.xml exists nowhere on disk and would fall into @gone.
    # Crawlers and third-party tools probe these names blindly; a 301 to the
    # real one is strictly more useful than 410.
    location ~* ^/sitemap(_index)?\.xml$ {
        return 301 /?sitemap=index;
    }

    # REST API. With plain permalinks WP serves it at /index.php?rest_route=/...
    # (that is what the site's own Link: header advertises), so /wp-json/ has to
    # be TRANSLATED, not merely passed through.
    #
    # The first version did `try_files $uri /index.php$is_args$args` -- without
    # rest_route WordPress fell back to the main query and answered every
    # /wp-json/* URL with 200 and the 115 KB homepage. That recreated, inside
    # the fix, exactly the soft-404 crawl trap the fix exists to remove.
    # Our rest_route goes LAST and the trailing "?" stops nginx appending the
    # client query again: PHP keeps the last duplicate, so a client-supplied
    # ?rest_route=&paged=100 would otherwise blank it and drop into the main
    # query -- deep pagination behind the /wp-json/ 410 exemption.
    # /wp-json/wp/v2/posts?per_page=1 -> /index.php?per_page=1&rest_route=/wp/v2/posts.
    location ^~ /wp-json/ {
        rewrite ^/wp-json/(.*)$ /index.php?$args&rest_route=/$1? last;
    }
    location = /wp-json {
        rewrite ^ /index.php?$args&rest_route=/? last;
    }

    # ---- [B] unknown path -> 410 instead of a 200 soft-404 ----
    # Self-maintaining: any file that really exists is still served; only paths
    # that exist nowhere on disk hit @gone.
    # !!! VALID ONLY WHILE PERMALINKS ARE PLAIN. If permalink_structure is ever
    # !!! set to /%postname%/ etc., replace "@gone" with "/index.php?$args"
    # !!! FIRST, or the whole site returns 410.
    location / {
        try_files $uri $uri/ @gone;
    }

    # "/" itself: the homepage and every /?sitemap=... URL. Same try_files as
    # "location /", plus the hand-off of mapped sitemap URLs to the static set.
    # (if + return is one of the documented-safe uses of if.)
    location = / {
        error_page 418 = @sitemap_static;
        if ($sph_sitemap_file) { return 418; }
        try_files $uri $uri/ @gone;
    }

    # [4] static sitemap; no file yet (before the first generation, or a page
    # the generator does not know) -> the old PHP path, unchanged.
    location @sitemap_static {
        root /var/www/sitemap/current;
        types { }
        default_type "application/xml; charset=UTF-8";
        gzip_static on;          # <name>.xml.gz is written next to <name>.xml
        gzip_vary   on;
        # every request arrives via Caddy (Via: header); with the default
        # gzip_proxied off nginx would never send the .gz to a proxied client
        gzip_proxied any;
        add_header X-Sitemap-Static 1 always;
        try_files /$sph_sitemap_file /index.php?$args;
    }

    # Habr parser scripts (site/parser): CLI-only, run by the host cron via
    # docker exec. No HTTP caller in the access logs (checked 2026-10-06);
    # over HTTP they would run the importer and expose its config.
    location ^~ /parser/ {
        return 404;
    }
    location = /parser {
        return 404;
    }

    location @gone {
        return 410;
    }

    # Uploads must never execute. Nothing executable lives there today (checked
    # 2026-08-11: no .php/.phar/.sql/.bak under wp-content/uploads), this is the
    # standard belt-and-braces against an upload bug turning into RCE.
    location ~* ^/wp-content/uploads/.*\.(php|phar|phtml)$ {
        deny all;
    }

    location ~* \.(bak|sql|sql\.gz|log|old|orig|save|swp|dist)$ {
        deny all;
    }

    location ~ \.php$ {
        # =404 blocks the classic /uploads/evil.jpg/x.php path-info attack:
        # without it nginx hands FPM a SCRIPT_FILENAME whose file does not
        # exist and, with cgi.fix_pathinfo left at its default 1, PHP walks
        # back the path and executes the uploaded file instead.
        try_files  $uri =404;
        limit_req  zone=sph_php burst=20 nodelay;
        limit_conn sph_conn 8;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\. {
        deny all;
    }

    location = /xmlrpc.php {
        deny all;
    }
}
